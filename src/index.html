    <meta name="theme-color" content="#05060b" />

    <!--
      Aperçu lors d'un partage (réseaux sociaux, messageries). Sans ces
      métadonnées, un lien vers le site s'affiche nu : ni titre, ni visuel, ni
      description — sur une page qui vend une formation à 997 €, c'est le
      premier contact avec un prospect.

      Elles sont statiques et décrivent l'accueil. Un robot d'aperçu n'exécute
      pas le JavaScript : quelle que soit la route partagée, il ne lit jamais
      que ce fichier. Les différencier par page exigerait un rendu serveur.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TradingCorp" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="https://tradingcorp.fr/" />
    <meta property="og:title" content="TradingCorp — Formation au trading en ligne" />
    <meta
      property="og:description"
      content="Formation en ligne au trading : un parcours vidéo progressif, des quiz de validation et un certificat de fin de parcours. Accès à vie."
    />
