<header class="page-tete">
  <h1 class="page-titre">Paramètres</h1>
  <p class="page-sous">
    Ce que la plateforme applique aujourd'hui, en lecture seule. Seuls les réglages dont
    l'application connaît réellement l'état figurent ici.
  </p>
</header>

<div class="panneau">
  <div class="panneau-tete">
    <h2 class="panneau-titre">Plateforme</h2>
  </div>
  <dl class="parametres-liste">
    <div class="parametres-ligne">
      <dt>Nom de la plateforme</dt>
      <dd>TradingCorp</dd>
    </div>
    <div class="parametres-ligne">
      <dt>Devise des paiements</dt>
      <dd>EUR (€)</dd>
    </div>
    <!-- Lu depuis la constante qui commande réellement l'affichage du bouton
         Google sur les écrans de connexion et d'inscription : cette ligne
         suivra donc son activation, au lieu d'annoncer un état figé. -->
    <div class="parametres-ligne">
      <dt>Connexion Google</dt>
      <dd>
        @if (googleActif) {
          <span class="badge-statut est-succes">Active</span>
        } @else {
          <span class="badge-statut">Inactive</span>
        }
      </dd>
    </div>
  </dl>
</div>
