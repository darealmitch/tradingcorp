<section class="notice" id="notice">
  <div class="notice-stage" #stage>
    <div class="container">
      <div class="section-head centered notice-head" appReveal>
        <span class="eyebrow">Témoignages</span>
        <h2>Changer de vie ne tient qu'à toi</h2>
        <p>Comme certains de <span class="text-gradient">nos membres l'ont déjà fait.</span></p>
      </div>
    </div>

    <!-- Bande en défilement continu : la liste est posée deux fois et la piste
         translate de -50 %, si bien que la seconde copie prend exactement la
         place de la première — la boucle est invisible. Même mécanique que la
         section Résultats qui suit. -->
    <div class="gallery">
      <div class="gallery-track" [class.est-en-pause]="activeAvis()">
        @for (copie of [0, 1]; track copie) {
          <ul class="gallery-list" [attr.aria-hidden]="copie === 1 ? true : null">
            @for (item of avis; track item.img; let i = $index) {
              <li>
                <button
                  type="button"
                  class="gallery-card"
                  [attr.tabindex]="copie === 1 ? -1 : null"
                  (click)="openAvis(i, $event)"
                >
                  <img [src]="media.url(item.img)" [alt]="item.alt" loading="lazy" />
                </button>
              </li>
            }
          </ul>
        }
      </div>
    </div>
  </div>
</section>

@if (activeAvis(); as item) {
  <div
    class="avis-modal"
    role="dialog"
    aria-modal="true"
    aria-label="Témoignage en grand"
    #dialogue
    tabindex="-1"
    (click)="fermerSiFond($event)"
    (keydown.escape)="closeAvis()"
    (keydown.arrowright)="next()"
    (keydown.arrowleft)="prev()"
  >
    <button
      type="button"
      class="avis-nav avis-prev"
      (click)="prev(); $event.stopPropagation()"
      [disabled]="activeIndex() === 0"
      aria-label="Témoignage précédent"
    >
      <span aria-hidden="true"></span>
    </button>

    <div class="avis-modal-inner">
      <button class="bouton-fermeture" type="button" (click)="closeAvis()" aria-label="Fermer">
        <app-icone nom="fermer" [taille]="18" />
      </button>
      @for (frame of [activeIndex()]; track frame) {
        <img class="avis-modal-img" [src]="media.url(item.img)" [alt]="item.alt" />
      }
    </div>

    <button
      type="button"
      class="avis-nav avis-next"
      (click)="next(); $event.stopPropagation()"
      aria-label="Témoignage suivant"
    >
      <span aria-hidden="true"></span>
    </button>
  </div>
}
