name: Sauvegarde de la base

# Le plan Supabase gratuit ne fournit NI sauvegarde quotidienne NI restauration
# à un instant donné (PITR). Constaté au pire moment : après une migration qui
# avait vidé des colonnes, il n'existait aucun point de retour — les données
# n'ont été reconstituées que parce qu'elles étaient, par chance, redéduisibles.
#
# Ce workflow produit une vraie sauvegarde : un dump du CONTENU, pas seulement
# du schéma (les migrations du dépôt suffiraient pour le schéma, jamais pour les
# données). Chaque dump est ensuite RESTAURÉ dans un Postgres jetable et
# recompté : une sauvegarde qu'on n'a jamais relue n'est pas une sauvegarde.

on:
  schedule:
    # 03h17 UTC — heure creuse, et décalée d'un rond pour éviter la minute
    # exacte où des milliers de workflows démarrent chez GitHub.
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  sauvegarder:
    runs-on: ubuntu-latest

    services:
      # Base jetable qui servira à vérifier que le dump se restaure.
      verification:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: verification
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      # pg_dump doit avoir la version du serveur : celui d'Ubuntu est plus
      # ancien et refuse de dumper une base Postgres 17 (« aborting because of
      # server version mismatch » — pg_dump n'accepte jamais un serveur plus
      # récent que lui-même, faute de connaître son catalogue système).
      #
      # Installer le paquet postgresql-client-17 NE SUFFIT PAS : Ubuntu fournit
      # déjà un pg_dump (v16) dans /usr/bin, et rien ne garantit qu'il cède la
      # place au nouveau. Constaté en production — le paquet 17 s'installait
      # sans erreur, mais `pg_dump` continuait de résoudre vers l'ancien
      # binaire. $GITHUB_PATH fait passer le dossier v17 devant pour le reste
      # du job (toutes les étapes suivantes, y compris la restauration).
      - name: Installer les outils PostgreSQL 17
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/pgdg.gpg
          sudo sh -c 'echo "deb [signed-by=/usr/share/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Vérifier la version effectivement utilisée
        run: |
          which pg_dump
          pg_dump --version
          # Si cette ligne annonce autre chose que 17.x, le PATH ne pointe
          # toujours pas vers le bon binaire — mieux vaut le voir ici, en
          # clair, qu'au travers d'un message d'erreur pg_dump.
          pg_dump --version | grep -q ' 17\.' || {
            echo "::error::pg_dump n'est pas en version 17 malgré l'installation"
            exit 1
          }

      - name: Dump du contenu
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "::error::secret SUPABASE_DB_URL absent"; exit 1; }
          # --format=custom : restauration sélective possible (une seule table
          # si besoin) et compression intégrée.
          # Les schémas internes de Supabase (auth, storage…) sont exclus : ils
          # sont recréés par la plateforme et leur restauration croisée échoue.
          # auth.users est la seule exception qui compterait — mais il n'est pas
          # dumpable sans privilèges superutilisateur ; voir la note ci-dessous.
          pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --schema=public \
            --no-owner --no-privileges \
            --file=sauvegarde.dump
          ls -lh sauvegarde.dump

      - name: Restauration de contrôle
        env:
          PGPASSWORD: verification
        run: |
          createdb -h localhost -U postgres controle
          # La restauration se fait sans les propriétaires ni les droits : le
          # Postgres jetable ne connaît pas les rôles Supabase (anon,
          # authenticated…). On vérifie ici que les DONNÉES reviennent.
          pg_restore -h localhost -U postgres -d controle --no-owner --no-privileges sauvegarde.dump 2>&1 \
            | grep -v 'does not exist' || true

          echo "### Lignes restaurées ###"
          for t in profils formations sections lecons quiz questions reponses inscriptions paiements progression_lecons; do
            n=$(psql -h localhost -U postgres -d controle -tAc "select count(*) from public.$t" 2>/dev/null || echo "ABSENTE")
            echo "$t = $n"
            if [ "$n" = "ABSENTE" ]; then echo "::error::table $t absente de la sauvegarde restaurée"; exit 1; fi
          done

          # Une base restaurée mais vide de contenu pédagogique signalerait un
          # dump tronqué : le cas doit faire échouer le workflow, pas produire
          # une archive rassurante.
          lecons=$(psql -h localhost -U postgres -d controle -tAc "select count(*) from public.lecons")
          if [ "$lecons" -lt 1 ]; then echo "::error::aucune leçon restaurée — dump suspect"; exit 1; fi

      # ─────────────────────────────────────────────────────────────────────
      # DÉPÔT DE LA SAUVEGARDE
      #
      # Ce dump était publié en artefact GitHub Actions. Le dépôt étant PUBLIC,
      # cela le rendait téléchargeable par n'importe qui pendant 30 jours —
      # identités, e-mails, dates de naissance et paiements compris. La
      # documentation GitHub le confirme : sur un dépôt public, « accès en
      # lecture » veut dire tout le monde, et l'API REST répond même sans
      # authentification.
      #
      # La sauvegarde va donc là où vivent déjà les données : le Storage
      # Supabase, à Paris, dans un bucket privé et sans policy, où seul le rôle
      # de service accède. Aucun tiers de plus, aucun transfert hors UE.
      #
      # Elle est en outre CHIFFRÉE avant de partir : même si le bucket venait à
      # être mal configuré un jour, le dump resterait illisible sans la clé.
      # ─────────────────────────────────────────────────────────────────────
      - name: Chiffrer la sauvegarde
        env:
          CLE: ${{ secrets.SAUVEGARDE_CHIFFREMENT }}
        run: |
          if [ -z "$CLE" ]; then
            echo "::error::secret SAUVEGARDE_CHIFFREMENT absent — refus de déposer un dump en clair"
            exit 1
          fi
          # AES-256, dérivation PBKDF2. Pour relire :
          #   openssl enc -d -aes-256-cbc -pbkdf2 -in <fichier> -out sauvegarde.dump
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in sauvegarde.dump -out sauvegarde.dump.enc -pass env:CLE
          ls -lh sauvegarde.dump.enc

      - name: Déposer dans le Storage Supabase
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          CLE_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$CLE_SERVICE" ]; then
            echo "::error::secrets SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY absents"
            exit 1
          fi
          NOM="sauvegarde-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}.dump.enc"

          CODE=$(curl -s -o reponse.txt -w '%{http_code}' \
            -X POST "$URL/storage/v1/object/sauvegardes/$NOM" \
            -H "Authorization: Bearer $CLE_SERVICE" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @sauvegarde.dump.enc)

          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "::error::dépôt de la sauvegarde refusé (HTTP $CODE)"
            cat reponse.txt
            exit 1
          fi
          echo "Sauvegarde déposée : $NOM"

      # Rétention de 30 jours — la même qu'auparavant, mais appliquée par nos
      # soins puisque le Storage n'expire rien tout seul. La durée est celle
      # déclarée dans `politique_conservation` : elles doivent rester alignées.
      - name: Purger les sauvegardes de plus de 30 jours
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          CLE_SERVICE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Le Storage n'expire rien de lui-même : la rétention de 30 jours,
          # déclarée dans `politique_conservation`, est appliquée ici. Les deux
          # doivent rester alignées — une durée annoncée mais jamais appliquée
          # vaut moins que pas de durée du tout.
          export LIMITE=$(date -u -d '30 days ago' +%Y-%m-%d)
          echo "Suppression des sauvegardes antérieures au $LIMITE"

          curl -s -X POST "$URL/storage/v1/object/list/sauvegardes" \
            -H "Authorization: Bearer $CLE_SERVICE" \
            -H "Content-Type: application/json" \
            -d '{"prefix":"","limit":1000,"sortBy":{"column":"created_at","order":"asc"}}' \
            > liste.json

          python3 -c "import json,os,sys;o=json.load(open('liste.json'));l=os.environ['LIMITE'];print(json.dumps([x['name'] for x in o if isinstance(x,dict) and x.get('created_at','')[:10] < l] if isinstance(o,list) else []))" > a_purger.json

          NOMBRE=$(python3 -c "import json;print(len(json.load(open('a_purger.json'))))")
          if [ "$NOMBRE" -gt 0 ]; then
            curl -s -X DELETE "$URL/storage/v1/object/sauvegardes" \
              -H "Authorization: Bearer $CLE_SERVICE" \
              -H "Content-Type: application/json" \
              -d "{\"prefixes\": $(cat a_purger.json)}" > /dev/null
            echo "$NOMBRE sauvegarde(s) purgée(s)."
          else
            echo "Aucune sauvegarde à purger."
          fi
