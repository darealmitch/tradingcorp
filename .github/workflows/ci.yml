name: CI & Déploiement

# Pipeline UNIQUE : vérifie à chaque push/PR, et publie DEUX fois depuis
# `main`, à partir du même code :
#
#   • Cloudflare Pages → https://tradingcorp.fr          le site de production
#   • GitHub Pages     → …github.io/tradingcorp/         la version de démonstration
#
# Une seule branche, un seul code source : rien ne peut diverger entre les deux.
# Seul le build change — la démonstration vit sous un chemin (`/tradingcorp/`),
# la production à la racine de son domaine.
#
# Le site publié est TOUJOURS construit à partir du commit courant — aucun
# dossier de build n'est versionné.
#
# La publication reste conditionnée à une vérification verte. C'est la raison
# pour laquelle le déploiement n'est PAS confié à l'intégration Git de
# Cloudflare, qui publierait à chaque push sans rien attendre : ici, un test
# rouge empêche la mise en ligne.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Un seul déploiement à la fois ; deux pushes rapprochés ne se doublent pas.
concurrency:
  group: deploiement
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Formatage (Prettier)
        run: npx prettier --check .

      # Placé avant les tests : une erreur de lint se corrige en quelques
      # secondes, autant ne pas attendre la fin d'une suite complète.
      - name: Qualité (ESLint)
        run: npx ng lint

      - name: Tests unitaires
        run: npx ng test
        env:
          CI: 'true'

      # Le dépôt et la base avaient divergé sans aucun signal — une migration
      # de sécurité n'avait jamais été appliquée. Cette étape le rend visible.
      # Sans le secret SUPABASE_DB_URL, elle s'ignore au lieu d'échouer.
      - name: Cohérence des migrations
        run: ./supabase/verifier-migrations.sh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # base-href = racine : le site est servi à la racine de tradingcorp.fr.
      # Le repli des routes profondes ne se fait plus en dupliquant l'index en
      # 404.html — `public/_redirects` l'exprime, et Cloudflare répond 200.
      - name: Build de production
        run: npx ng build --base-href /

      # Le build voyage jusqu'au job de publication plutôt que d'être refait :
      # reconstruire, c'est publier autre chose que ce qui vient d'être testé.
      - name: Conserver le build pour la publication
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/TradingCorp/browser
          retention-days: 1

  # Les Edge Functions vivent hors du projet Angular, dans un autre exécutable :
  # rien ne les compilait jusqu'ici, et une erreur de type n'apparaissait qu'au
  # déploiement, en production.
  fonctions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # `--config` désigne le deno.json des fonctions. Sans lui, Deno remonte
      # jusqu'au package.json d'Angular à la racine, bascule en résolution
      # node_modules et échoue : « Could not find a matching package for
      # npm:stripe@18 ». Les Edge Functions n'ont rien à voir avec les
      # dépendances du front — ce fichier les en sépare, et le contrôle passe
      # de plusieurs minutes à deux secondes.
      - name: Typage des Edge Functions
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

  # Tests d'autorisation : une base éphémère est reconstruite à partir des
  # seules migrations du dépôt, puis interrogée sous chaque identité.
  #
  # Ce job vérifie deux choses d'un coup : que les policies refusent bien ce
  # qu'elles doivent refuser, et que les migrations du dépôt suffisent à
  # rebâtir la base. Dès son premier passage, il a prouvé son utilité : les
  # privilèges de table n'étaient nulle part dans le dépôt — Supabase les
  # posait à la création du projet, et rien ne l'écrivait (voir la migration
  # privileges_tables_versionnes).
  base:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Le dépôt ne versionne pas de config.toml : on repart de la
      # configuration par défaut du CLI, sans rien figer.
      - name: Initialiser la configuration locale
        run: supabase init || true

      - name: Démarrer la base et rejouer les migrations
        run: supabase db start

      - name: Tests d'autorisation
        run: supabase test db

  deploy:
    # Publication seulement après une vérification verte, et seulement sur main.
    #
    # `fonctions` et `base` ne conditionnent volontairement pas la publication
    # tant qu'ils n'ont pas tourné vert une première fois : leur échec rend la
    # CI rouge — le signal est là — sans immobiliser le site. Les ajouter ici
    # (needs: [verify, fonctions, base]) est la marche suivante.
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le build vérifié
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      # Deux secrets à poser dans le dépôt (Settings → Secrets → Actions) :
      #   CLOUDFLARE_API_TOKEN   jeton limité à « Cloudflare Pages : Edit »
      #   CLOUDFLARE_ACCOUNT_ID  visible dans l'URL du tableau de bord Cloudflare
      - name: Déployer sur Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=tradingcorp --branch=main

  # ───────────────────────────────────────────────────────────────────────────
  # VERSION DE DÉMONSTRATION — GitHub Pages
  #
  # Même code, autre adresse : elle sert à montrer le projet sans donner
  # l'adresse commerciale. Trois différences, toutes produites ici et jamais
  # dans les sources, pour qu'il n'existe qu'une seule version du code :
  #
  #   1. `--base-href /tradingcorp/` — GitHub Pages sert sous le nom du dépôt ;
  #   2. `404.html` — le repli SPA de GitHub Pages, qui ignore `_redirects` ;
  #   3. un `robots.txt` fermé et pas de `sitemap.xml` — deux sites au contenu
  #      identique se cannibalisent dans les moteurs de recherche, et c'est
  #      tradingcorp.fr qui doit ressortir.
  #
  # Le build n'est pas réutilisable depuis `verify` : un `base-href` est inscrit
  # dans les fichiers produits, il faut donc reconstruire.
  # ───────────────────────────────────────────────────────────────────────────
  demonstration:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Build de démonstration
        run: npx ng build --base-href /tradingcorp/

      - name: Repli SPA et retrait du référencement
        run: |
          cd dist/TradingCorp/browser
          cp index.html 404.html
          rm -f sitemap.xml
          printf '# Version de démonstration — le site indexable est https://tradingcorp.fr\nUser-agent: *\nDisallow: /\n' > robots.txt

      - name: Préparer l'artefact Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/TradingCorp/browser

      - name: Publier sur GitHub Pages
        id: publication
        uses: actions/deploy-pages@v4
