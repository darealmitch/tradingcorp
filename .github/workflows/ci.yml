name: CI & Déploiement

# Pipeline UNIQUE : vérifie à chaque push/PR, et publie sur GitHub Pages
# uniquement depuis `main`. Le site publié est TOUJOURS construit à partir du
# commit courant — aucun dossier de build n'est versionné.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; deux pushes rapprochés ne se doublent pas.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Formatage (Prettier)
        run: npx prettier --check .

      # Placé avant les tests : une erreur de lint se corrige en quelques
      # secondes, autant ne pas attendre la fin d'une suite complète.
      - name: Qualité (ESLint)
        run: npx ng lint

      - name: Tests unitaires
        run: npx ng test
        env:
          CI: 'true'

      # Le dépôt et la base avaient divergé sans aucun signal — une migration
      # de sécurité n'avait jamais été appliquée. Cette étape le rend visible.
      # Sans le secret SUPABASE_DB_URL, elle s'ignore au lieu d'échouer.
      - name: Cohérence des migrations
        run: ./supabase/verifier-migrations.sh
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # base-href = chemin du site Pages (https://<user>.github.io/tradingcorp/).
      - name: Build de production
        run: npx ng build --base-href /tradingcorp/

      # GitHub Pages sert 404.html sur toute URL inconnue : en y plaçant
      # l'index, les routes Angular profondes (/parcours, /espace…) fonctionnent.
      - name: Repli SPA pour les routes profondes
        run: cp dist/TradingCorp/browser/index.html dist/TradingCorp/browser/404.html

      - name: Préparer l'artefact Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/TradingCorp/browser

  # Les Edge Functions vivent hors du projet Angular, dans un autre exécutable :
  # rien ne les compilait jusqu'ici, et une erreur de type n'apparaissait qu'au
  # déploiement, en production.
  fonctions:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typage des Edge Functions
        run: deno check supabase/functions/*/index.ts

  # Tests d'autorisation : une base éphémère est reconstruite à partir des
  # seules migrations du dépôt, puis interrogée sous chaque identité.
  #
  # Ce job vérifie deux choses d'un coup : que les policies refusent bien ce
  # qu'elles doivent refuser, et que les 32 fichiers de migration suffisent à
  # rebâtir la base — ce que la réconciliation de P-01 a rendu vrai sur le
  # papier sans jamais l'avoir rejoué.
  base:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Le dépôt ne versionne pas de config.toml : on repart de la
      # configuration par défaut du CLI, sans rien figer.
      - name: Initialiser la configuration locale
        run: supabase init || true

      - name: Démarrer la base et rejouer les migrations
        run: supabase db start

      - name: Tests d'autorisation
        run: supabase test db

  deploy:
    # Publication seulement après une vérification verte, et seulement sur main.
    #
    # `fonctions` et `base` ne conditionnent volontairement pas la publication
    # tant qu'ils n'ont pas tourné vert une première fois : leur échec rend la
    # CI rouge — le signal est là — sans immobiliser le site. Les ajouter ici
    # (needs: [verify, fonctions, base]) est la marche suivante.
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
